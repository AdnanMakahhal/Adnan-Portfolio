<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<filter id="clouds" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency=".007 .011" numOctaves="5" seed="12"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncR type="linear" slope="1.4" intercept=".05"/><feFuncG type="linear" slope="1.4" intercept=".05"/><feFuncB type="linear" slope="1.4" intercept=".05"/></feComponentTransfer>
<feGaussianBlur stdDeviation="1.5"/>
</filter>
<rect width="1600" height="1100" fill="#b8b8b8"/>
<rect width="1600" height="1100" filter="url(#clouds)" opacity=".8"/>
</svg>
